<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>年号ならべバトル（仮）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--panel:#ffffff;--panel2:#eef1f8;--line:#d6dbe8;--ink:#1b2233;--ink2:#3d465c;--sub:#667089;--ph:#9aa3b5;--acc:#3d5afe;--onacc:#ffffff;--accd:rgba(61,90,254,.08);--ok:#0f9d63;--okd:rgba(15,157,99,.08);--ng:#e5484d;--ngd:rgba(229,72,77,.07);--gem:#0a84d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
.mono{font-family:"JetBrains Mono",monospace}
#app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom));gap:10px}
#app.wide{max-width:none;padding:20px 28px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:900;background:var(--acc);color:var(--onacc);width:100%;letter-spacing:.03em}
.btn:disabled{opacity:.3}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
input{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--panel);font:inherit;font-size:17px;padding:13px 14px;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--acc)}
input::placeholder{color:var(--ph)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px}
.label{font-size:13px;font-weight:700;color:var(--acc)}
.sub{font-size:12.5px;color:var(--sub)}
.grow{flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.center{text-align:center}
.gem{color:var(--gem);font-weight:700}
.err{color:var(--ng);font-size:13px;min-height:1.3em;text-align:center}
/* home */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.home h1{font-size:clamp(26px,8vw,34px);font-weight:900;text-align:center;line-height:1.25}
.home h1 small{display:block;font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.1em;margin-bottom:6px}
.demo{font-size:11px;color:var(--sub);text-align:center;border:1px dashed var(--line);border-radius:10px;padding:6px}
/* lobby */
.big{font-size:44px;font-weight:900;line-height:1}
.rank{display:flex;flex-direction:column;gap:4px}
.rank div{display:flex;justify-content:space-between;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--panel)}
.rank div.me{outline:1px solid var(--acc)}
.pulse{animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.45}}
/* bet */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .n{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .b{font-size:54px;font-weight:900;color:var(--gem);line-height:1.1}
.okb{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub);display:inline-block}
.okb.on{border-color:var(--ok);color:var(--ok)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* play */
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);flex:none}
.race{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.race div{border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:6px;overflow:hidden;white-space:nowrap}
.race div.act{border-color:var(--acc);color:var(--ink)}
.race b{font-size:16px;color:var(--ink);font-weight:900}
.goal{flex:none;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.dots b{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--sub);margin-left:3px}
.dots b.on{background:var(--acc);border-color:var(--acc)}
.timer{font-size:14px;color:var(--ink)}
.panel{flex:none;height:128px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.panel.ask{border-color:var(--acc);background:var(--accd)}
.panel.ok{border-color:var(--ok);background:var(--okd)}
.panel.ng{border-color:var(--ng);background:var(--ngd)}
.panel .who{font-size:12px;color:var(--sub)}
.panel .ttl{font-size:18px;font-weight:900;line-height:1.35}
.panel .ttl .yr{color:var(--acc);margin-right:6px}
.panel .txt{font-size:14px;line-height:1.5;color:var(--ink2)}
.dir{flex:none;font-size:13px;font-weight:700;color:var(--acc);text-align:center;line-height:1.2}
.dir small{font-size:11px;font-weight:500;color:var(--sub);margin-left:6px}
.race em{font-style:normal;margin-left:6px;color:var(--acc);font-weight:700}
.timer.hot{color:var(--ng)}
.panel .ttl.v{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:22px}
.panel .ttl.v span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .ttl.v small{font-size:12px;font-weight:700;white-space:nowrap}
.panel.ok .ttl.v{color:var(--ok)}
.panel.ng .ttl.v{color:var(--ng)}
.panel .ans{font-size:15px;font-weight:700}
.panel .ans .yr{color:var(--acc);margin-right:6px}
.tl{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:opacity .2s}
.tl.dim,.hand.dim{opacity:.4}
.tr{flex:1 1 0;min-height:0;max-height:50px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:clamp(12px,3.9vw,15px);overflow:hidden;background:var(--panel);color:var(--ink);font-family:inherit;text-align:left;width:100%}
.tr .y{width:44px;flex:none;color:var(--sub)}
.tr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.ok{border:2px solid var(--ok);background:var(--okd)}
.tr.ng{border:2px solid var(--ng);background:var(--ngd)}
.tr.pre{flex:1.5 1 0;max-height:54px;border:2px solid var(--acc);background:var(--acc);color:var(--onacc);font-weight:900;justify-content:center}
.slot{flex:1 1 0;min-height:0;max-height:44px;border:1.5px dashed var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3.6vw,14px);font-weight:700;color:var(--acc);background:var(--accd);overflow:hidden;line-height:1;font-family:inherit;width:100%}
.ghost-card{position:fixed!important;z-index:50;margin:0;pointer-events:none;max-height:none!important;box-shadow:0 8px 20px rgba(27,34,51,.18);border:2px solid var(--acc)!important;background:var(--panel)!important}
.ghost-card.ng{border-color:var(--ng)!important;background:linear-gradient(var(--ngd),var(--ngd)),var(--panel)!important}
.spark{position:fixed;z-index:51;width:9px;height:3px;border-radius:2px;pointer-events:none}
.foot{flex:none;display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.hand{flex:none;display:grid;gap:6px;height:84px;transition:opacity .2s}
.hc{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px;font-size:clamp(11px,3.4vw,13.5px);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;overflow:hidden;color:var(--ink);word-break:auto-phrase;text-wrap:balance;line-break:strict}
.hc.m{font-size:clamp(10.5px,3.2vw,12.5px)}
.hc.l{font-size:clamp(10px,2.9vw,11.5px)}
.hc.can{border:2px solid var(--acc)}
.hc.on{border:2px solid var(--acc);background:var(--accd);color:var(--acc)}
/* result */
.rescard{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.res{font-size:30px;font-weight:900}
.res.win{color:var(--acc)}
.res.lose{color:var(--ng)}
.miss{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:13px}
.miss div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.miss b{color:var(--acc);margin-right:6px}
.yin{flex:none;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;letter-spacing:.08em}
.yin i{font-style:normal;font-size:16px;color:var(--sub);margin-left:6px;letter-spacing:0}
.yin .ph{font-size:16px;color:var(--ph);letter-spacing:0;font-family:"Noto Sans JP",sans-serif}
.keys{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:48px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;font-size:20px;font-weight:700;font-family:"JetBrains Mono",monospace}
.keys button.go{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-family:inherit;font-size:16px;font-weight:900}
.keys button:disabled{opacity:.3}
.link{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;align-self:center;padding:4px}
/* teacher */
.thead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex:none;flex-wrap:wrap}
.code{font-size:clamp(48px,9vw,96px);font-weight:700;letter-spacing:.12em;color:var(--acc);line-height:1}
.plist{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));grid-auto-rows:48px;gap:8px;overflow:hidden;align-content:start}
.pl{display:grid;grid-template-columns:24px minmax(0,1fr) 62px 44px 62px 44px;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 10px;font-size:15px}
.pl.off{opacity:.4}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{font-size:11px;color:var(--sub);text-align:center}
.pl .st.play{color:var(--acc)}
.pl .st.wait{color:var(--gem)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="cards.js"></script>
<script>
"use strict";
/* ========== 設定（ルールの数字はここで変えられます） ========== */
const RULE={hand:4,lineMax:15,winsNeeded:2,turnSec:30,betSec:30,roundGapSec:4,voidSec:60,startGems:10};

/* ========== 小道具 ========== */
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SS={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const rid=n=>Array.from({length:n},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));

/* ========== カード ========== */
const CARDS={};let IDS=[];
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}
function loadCards(){parseCSV(window.CARDS_CSV||'').slice(1).forEach(r=>{const id='c'+r[0].trim(),year=parseInt(r[3],10);if(!r[1]||isNaN(year))return;CARDS[id]={id,title:r[1].trim(),text:(r[2]||'').trim(),year,scope:(r[4]||'').trim()}});IDS=Object.keys(CARDS)}

/* ========== 通信（デモ用：同じブラウザのタブ同士） ========== */
function makeLocal(){
  const KEY='nengo-battle-db',subs=new Set();let pend=false;
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
  const seg=p=>p.split('/').filter(Boolean);
  const getIn=(d,p)=>{let c=d;for(const k of seg(p)){if(c==null||typeof c!=='object')return null;c=c[k]}return c===undefined?null:c};
  const clean=v=>{if(v===null||v===undefined)return null;if(Array.isArray(v)){const a=v.map(clean);return a.length?a:null}if(typeof v==='object'){const o={};for(const k in v){const c=clean(v[k]);if(c!==null)o[k]=c}return Object.keys(o).length?o:null}return v};
  const setIn=(d,p,v)=>{const s=seg(p);let c=d;for(let i=0;i<s.length-1;i++){if(c[s[i]]==null||typeof c[s[i]]!=='object')c[s[i]]={};c=c[s[i]]}v=clean(v);if(v===null)delete c[s[s.length-1]];else c[s[s.length-1]]=v};
  const fire=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;const d=load();[...subs].forEach(s=>{if(subs.has(s))s.cb(clone(getIn(d,s.path)))})},0)};
  const save=d=>{localStorage.setItem(KEY,JSON.stringify(d));fire()};
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  localStorage.setItem('nengo-battle-test','1');
  return{demo:true,now:()=>Date.now(),
    get:async p=>clone(getIn(load(),p)),
    set:async(p,v)=>{const d=load();setIn(d,p,v);save(d)},
    update:async(p,o)=>{const d=load();for(const k in o)setIn(d,p+'/'+k,o[k]);save(d)},
    tx:async(p,fn)=>{const d=load();const r=fn(clone(getIn(d,p)));if(r===undefined)return{committed:false};setIn(d,p,r);save(d);return{committed:true}},
    on:(p,cb)=>{const s={path:p,cb};subs.add(s);setTimeout(()=>{if(subs.has(s))cb(clone(getIn(load(),p)))},0);return()=>subs.delete(s)}};
}
/* ========== 通信（本番用：Firebase Realtime Database） ========== */
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('load '+src));document.head.appendChild(s)})}
async function makeFirebase(cfg){
  const v='10.12.2',base='https://www.gstatic.com/firebasejs/'+v+'/';
  await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-database-compat.js');
  firebase.initializeApp(cfg);const db=firebase.database();let off=0;
  db.ref('.info/serverTimeOffset').on('value',s=>{off=s.val()||0});
  return{demo:false,now:()=>Date.now()+off,
    get:async p=>(await db.ref(p).get()).val(),
    set:(p,v)=>db.ref(p).set(v),
    update:(p,o)=>db.ref(p).update(o),
    tx:async(p,fn)=>{const r=await db.ref(p).transaction(fn,undefined,false);return{committed:r.committed}},
    on:(p,cb)=>{const r=db.ref(p),h=r.on('value',s=>cb(s.val()));return()=>r.off('value',h)}};
}
let DB;

/* ========== 状態 ========== */
const S={role:null,code:null,uid:null,name:'',meta:undefined,players:{},seen:{},assign:null,mid:null,match:null,rev:null,oppSeen:0,waiting:false,sel:null,closeArm:false,homeErr:''};
const FB=4500,LOCK=2500;
let unsubs=[],munsubs=[],busy={},lastBeat=0,lastQ=0,lastKey='',lastTurnStart=0,lastHtml='';
const R=()=>'rooms/'+S.code;
const me=()=>S.players[S.uid];
const other=(m,u)=>m.ids[0]===u?m.ids[1]:m.ids[0];
function norm(m){m.deck=m.deck||[];m.line=m.line||[];m.hands=m.hands||{};m.miss=m.miss||{};m.ok=m.ok||{};m.bet=m.bet||{};m.wins=m.wins||{};m.ids.forEach(u=>{m.hands[u]=m.hands[u]||[];m.miss[u]=m.miss[u]||{};m.wins[u]=m.wins[u]||0;m.ok[u]=!!m.ok[u];m.bet[u]=m.bet[u]||1});return m}
async function once(key,fn){if(busy[key])return;busy[key]=true;try{await fn()}catch(e){console.error(key,e)}finally{busy[key]=false}}

/* ========== 効果音（サンプル。音のファイルは使わず、その場で音を作っています） ========== */
const SFX=(()=>{let ctx=null,on=true;try{on=localStorage.getItem('nb-sfx')!=='0'}catch(e){}
  // [高さHz, 始まり(秒), 長さ(秒), 音色, 音量]
  const SEQ={tap:[[660,0,.05,'triangle',.06]],pick:[[523,0,.07,'triangle',.09],[784,.06,.1,'triangle',.09]],sel:[[440,0,.07,'triangle',.08]],
    ok:[[659,0,.12,'sine',.12],[880,.1,.12,'sine',.12],[1319,.2,.28,'sine',.12]],ng:[[311,0,.16,'triangle',.11],[233,.15,.3,'triangle',.11]],
    turn:[[880,0,.09,'sine',.09],[1175,.09,.18,'sine',.09]],match:[[523,0,.1,'sine',.1],[659,.1,.1,'sine',.1],[784,.2,.22,'sine',.1]],
    round:[[784,0,.12,'sine',.11],[988,.12,.26,'sine',.11]],win:[[523,0,.12,'sine',.12],[659,.12,.12,'sine',.12],[784,.24,.12,'sine',.12],[1047,.36,.45,'sine',.12]],
    lose:[[392,0,.2,'sine',.1],[330,.2,.2,'sine',.1],[262,.4,.45,'sine',.1]],
    snap:[[2600,0,.03,'square',.04],[1319,.03,.16,'sine',.12],[1976,.11,.26,'sine',.1]],bump:[[170,0,.18,'sine',.3],[440,0,.04,'triangle',.07],[110,.12,.16,'sine',.22]]};
  const tone=(f,t,d,type,v)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.03)};
  return{get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('nb-sfx',on?'1':'0')}catch(e){}if(on)this.play('pick');return on},
    play(n){if(!on||!SEQ[n])return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime+.01;SEQ[n].forEach(a=>tone(a[0],t+a[1],a[2],a[3],a[4]))}catch(e){}}}})();
function sfxMatch(pv,m){if(!m)return;const u=S.uid;if(!pv){if(m.phase==='bet')SFX.play('match');return}
  if(m.last&&m.last.to&&(!pv.last||pv.last.at!==m.last.at))SFX.play('ng');
  if(m.phase==='play'&&m.turn===u&&(pv.turn!==u||pv.phase!=='play'))setTimeout(()=>SFX.play('turn'),m.last&&DB.now()-m.last.at<1500?(m.last.ok||m.last.to?1000:2300):0);
  if(m.phase==='roundEnd'&&pv.phase!=='roundEnd'&&m.rw===u)setTimeout(()=>SFX.play('round'),700);
  if(m.phase==='done'&&pv.phase!=='done')setTimeout(()=>SFX.play(m.winner===u?'win':'lose'),300)}

/* ========== 置いたときの動き（はじかれる・カチッとはまる・手札から飛ぶ・年表が開く・手札が詰まる） ==========
   置いた直後は LOCK（2.5秒）のあいだ次の操作ができないので、動きはその中に収まるようにしてある */
const ANIM={gen:0,els:new Set()};
const EZ='cubic-bezier(.2,.7,.2,1)',wait=ms=>new Promise(r=>setTimeout(r,ms));
function animCleanup(){ANIM.gen++;ANIM.els.forEach(e=>e.remove());ANIM.els.clear()}
function rectsOf(sel){const o={};app.querySelectorAll(sel).forEach(e=>{o[e.dataset.k]=e.getBoundingClientRect()});return o}
function animSnap(m){const l=m.last;if(!app.querySelector('.tl'))return null;
  const src=(l.u===S.uid&&app.querySelector(`.hand .hc[data-k="${l.c}"]`))||app.querySelector('.panel .ttl');
  return{rows:rectsOf('.tl .tr[data-k]'),hand:rectsOf('.hand .hc[data-k]'),src:src?src.getBoundingClientRect():null}}
function flipFrom(els,old,dur){return Promise.all(els.map(e=>{const a=old(e);if(!a)return;const b=e.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;
  return e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:dur,easing:EZ}).finished.catch(()=>{})}))}
function nudge(el,px,dur,delay){return el?el.animate([{transform:'none'},{transform:`translateY(${px}px)`,offset:.45},{transform:'none'}],{duration:dur,delay:delay||0,easing:'ease-out'}).finished.catch(()=>{}):null}
function ghost(from,r,cls){const f=from.cloneNode(true);f.classList.remove('ok','ng');f.classList.add('ghost-card');if(cls)f.classList.add(cls);
  Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',visibility:''});document.body.append(f);ANIM.els.add(f);return f}
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function sparks(el,color,n){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rx=r.width/2,ry=r.height/2+2;
  for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+.26,ex=Math.cos(a),ey=Math.sin(a),ang=a*180/Math.PI,d=14+(i%3)*5;
    const s=document.createElement('div');s.className='spark';s.style.left=(cx+ex*rx*(Math.abs(ex)>.5?1:.6))+'px';s.style.top=(cy+ey*ry)+'px';s.style.background=color;document.body.append(s);ANIM.els.add(s);
    s.animate([{transform:`translate(-50%,-50%) rotate(${ang}deg) translateX(0) scaleX(.4)`,opacity:1},{transform:`translate(-50%,-50%) rotate(${ang}deg) translateX(${d}px) scaleX(1)`,opacity:0}],{duration:480,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'}).finished.then(()=>{s.remove();ANIM.els.delete(s)},()=>{})}}
async function animPlace(snap,m){const l=m.last,fallback=()=>SFX.play(l.ok?'ok':'ng');
  const tl=app.querySelector('.tl'),nr=tl&&tl.querySelector(`.tr[data-k="${l.c}"]`);
  if(!snap||!nr||!nr.animate||matchMedia('(prefers-reduced-motion: reduce)').matches)return fallback();
  const gen=ANIM.gen,alive=()=>gen===ANIM.gen,bounce=!l.ok&&l.g!=null;
  try{
    nr.classList.remove('ok','ng');
    const home=nr.nextElementSibling;
    if(bounce){const after=m.line.filter(x=>x!==l.c)[l.g];tl.insertBefore(nr,after?tl.querySelector(`.tr[data-k="${after}"]`):null)}
    const rows=[...tl.querySelectorAll('.tr[data-k]')].filter(r=>r!==nr);
    const hb=[...app.querySelectorAll('.hand .hc[data-k]')],hasHand=Object.keys(snap.hand).length>0;
    const drawn=hasHand&&l.u===S.uid?hb.filter(b=>!snap.hand[b.dataset.k]):[];
    drawn.forEach(b=>b.style.visibility='hidden');
    const panel=app.querySelector('.panel');if(panel)panel.animate([{opacity:0},{opacity:1}],{duration:200,delay:400,fill:'backwards'});
    // 年表が開く・手札から飛ぶ・手札が詰まる
    nr.style.visibility='hidden';const dst=nr.getBoundingClientRect();
    const moves=[flipFrom(rows,e=>snap.rows[e.dataset.k],320),flipFrom(hb.filter(b=>snap.hand[b.dataset.k]),e=>snap.hand[e.dataset.k],260)];
    if(snap.src){const s=snap.src,f=ghost(nr,s);
      moves.push(f.animate([{left:s.left+'px',top:s.top+'px',width:s.width+'px',height:s.height+'px'},{left:dst.left+'px',top:dst.top+'px',width:dst.width+'px',height:dst.height+'px'}],{duration:400,easing:EZ,fill:'forwards'}).finished.then(()=>{f.remove();ANIM.els.delete(f)}))}
    await Promise.all(moves);if(!alive())return;
    nr.style.visibility='';
    if(l.ok){
      // カチッとはまる
      nr.classList.add('ok');const okc=tok('--ok'),y=nr.querySelector('.y');
      setTimeout(()=>{if(alive()){SFX.play('snap');sparks(nr,okc,12)}},150);
      await Promise.all([
        nr.animate([{transform:'translateY(-14px) scale(1.18)'},{transform:'translateY(2px) scale(.93)',offset:.5},{transform:'translateY(-1px) scale(1.02)',offset:.78},{transform:'none'}],{duration:440,easing:'cubic-bezier(.3,.7,.3,1)'}).finished,
        nr.animate([{boxShadow:`0 0 0 0 ${okc}`},{boxShadow:'0 0 0 18px transparent'}],{duration:650,delay:140,easing:'ease-out'}).finished,
        nr.animate([{backgroundColor:okc},{backgroundColor:'transparent'}],{duration:500,delay:140,easing:'ease-out'}).finished,
        y?y.animate([{transform:'none'},{transform:'scale(1.45)',offset:.4},{transform:'none'}],{duration:420,delay:140,easing:'ease-out'}).finished:null,
        nudge(nr.previousElementSibling,-7,300,140),nudge(nr.nextElementSibling,7,300,140)]);
      return}
    nr.classList.add('ng');
    if(!bounce){SFX.play('ng');return}
    // はじかれる：前後に押し返されて外へ出て、正しい場所に収まる
    SFX.play('bump');const ngc=tok('--ng');
    await Promise.all([
      nr.animate([{transform:'none'},{transform:'scale(.9,.72)',offset:.5},{transform:'none'}],{duration:260,easing:'ease-out'}).finished,
      nr.animate([{boxShadow:`0 0 0 0 ${ngc}`},{boxShadow:'0 0 0 14px transparent'}],{duration:420,easing:'ease-out'}).finished,
      nudge(nr.previousElementSibling,8,260),nudge(nr.nextElementSibling,-8,260)]);
    if(!alive())return;
    const a=nr.getBoundingClientRect(),f=ghost(nr,a,'ng'),out='translate(20px,-36px) rotate(-10deg) scale(.9)';
    const b1=new Map(rows.map(r=>[r,r.getBoundingClientRect()]));nr.remove();
    await Promise.all([flipFrom(rows,e=>b1.get(e),300),f.animate([{transform:'none'},{transform:out}],{duration:340,easing:'cubic-bezier(.2,1.5,.45,1)',fill:'forwards'}).finished]);
    await wait(320);if(!alive())return;
    const b2=new Map(rows.map(r=>[r,r.getBoundingClientRect()]));
    nr.style.visibility='hidden';tl.insertBefore(nr,home&&home.parentNode===tl?home:null);
    const d=nr.getBoundingClientRect();
    await Promise.all([flipFrom(rows,e=>b2.get(e),380),f.animate([{transform:out},{transform:`translate(${d.left-a.left}px,${d.top-a.top}px)`}],{duration:520,easing:'cubic-bezier(.45,0,.2,1)',fill:'forwards'}).finished]);
    if(!alive())return;
    f.remove();ANIM.els.delete(f);nr.style.visibility='';
    // 1枚引く
    drawn.forEach(b=>{b.style.visibility='';b.animate([{transform:'translateY(-16px)',opacity:0},{transform:'none',opacity:1}],{duration:320,easing:EZ})});
  }catch(e){console.error('anim',e);if(alive()){lastHtml='';render()}}
}

/* ========== 対戦のルール（データの書きかえ） ========== */
function pass(m,mover){m.turn=other(m,mover);m.turnStart=DB.now();m.pick=null;m.pickAt=null}
function endRound(m,winner){m.phase='roundEnd';m.rw=winner||'draw';m.rEnd=DB.now();m.pick=null;m.pickAt=null;m.firstOut=false;if(winner)m.wins[winner]=(m.wins[winner]||0)+1}
function resolve(m,mover){
  const opp=other(m,mover),empty=m.hands[mover].length===0;
  if(m.firstOut)return endRound(m,empty?null:m.first);
  if(empty){if(mover===m.first&&m.hands[opp].length===1){m.firstOut=true;return pass(m,mover)}return endRound(m,mover)}
  if(m.line.length>=RULE.lineMax)return endRound(m,null);
  pass(m,mover);
}
function deal(m){
  const d=shuffle(IDS);m.line=[d.pop()];m.hands={};m.ids.forEach(u=>{m.hands[u]=d.splice(0,RULE.hand)});m.deck=d;
  m.first=m.round?other(m,m.first):m.ids[Math.floor(Math.random()*2)];m.round=(m.round||0)+1;
  m.turn=m.first;m.turnStart=DB.now();m.pick=null;m.pickAt=null;m.last=null;m.firstOut=false;m.phase='play';
}
const mpath=()=>R()+'/matches/'+S.mid;
const txMatch=fn=>DB.tx(mpath(),m=>{if(!m)return m;norm(m);return fn(m)});

function ensureMatch(){if(!S.assign||S.match)return;const a=S.assign,ids=[S.uid,a.opp].sort();
  once('mk',()=>DB.tx(mpath(),m=>{if(m)return undefined;const o={ids,names:{},bet:{},ok:{},wins:{},phase:'bet',betStart:DB.now(),round:0};
    o.names[S.uid]=S.name;o.names[a.opp]=(S.players[a.opp]||{}).n||'あいて';ids.forEach(u=>{o.bet[u]=1;o.ok[u]=false;o.wins[u]=0});return o}))}
function setBet(n){const g=(me()||{}).g||1;n=Math.max(1,Math.min(g,n));txMatch(m=>{if(m.phase!=='bet')return undefined;m.bet[S.uid]=n;m.ids.forEach(u=>m.ok[u]=false);return m})}
function okBet(){txMatch(m=>{if(m.phase!=='bet')return undefined;m.ok[S.uid]=true;return m})}
function startMatch(timeout){once('start',()=>txMatch(m=>{if(m.phase!=='bet')return undefined;const both=m.ids.every(u=>m.ok[u]);if(!both){if(!timeout)return undefined;m.ids.forEach(u=>m.bet[u]=1)}deal(m);return m}))}
function pickCard(c){txMatch(m=>{if(m.phase!=='play'||m.turn!==S.uid||m.hands[S.uid].indexOf(c)<0)return undefined;m.pick=c;m.pickAt=DB.now();return m});S.sel=null}
function place(g){const c=S.match.pick,u=S.uid;once('place',()=>txMatch(m=>{
  if(m.phase!=='play'||m.turn!==u||m.pick!==c)return undefined;const h=m.hands[u],i=h.indexOf(c);if(i<0)return undefined;h.splice(i,1);
  const y=CARDS[c].year,L=m.line,ok=(g===0||CARDS[L[g-1]].year<=y)&&(g>=L.length||y<=CARDS[L[g]].year);
  let pos=g;if(!ok){pos=L.findIndex(x=>CARDS[x].year>y);if(pos<0)pos=L.length}L.splice(pos,0,c);
  if(!ok){if(m.deck.length)h.push(m.deck.pop());m.miss[u][c]=true}
  m.last={u,c,ok,g,at:DB.now()};resolve(m,u);return m}));S.sel=null}
function timeoutTurn(T,ts){once('to',()=>txMatch(m=>{if(m.phase!=='play'||m.turn!==T||m.turnStart!==ts)return undefined;if(m.deck.length)m.hands[T].push(m.deck.pop());m.last={u:T,to:true,at:DB.now()};resolve(m,T);return m}))}
function nextRound(){once('next',()=>txMatch(m=>{if(m.phase!=='roundEnd')return undefined;const w=m.ids.find(u=>m.wins[u]>=RULE.winsNeeded);if(w){m.phase='done';m.winner=w}else deal(m);return m}))}
function voidMatch(){once('void',()=>txMatch(m=>{if(m.phase==='done'||m.phase==='void')return undefined;m.phase='void';return m}))}
function settle(){const m=S.match,mid=S.mid,u=S.uid,opp=other(m,u);
  once('settle',()=>DB.tx(R()+'/players/'+u,p=>{if(!p)return p;if(p.ls===mid)return undefined;
    if(m.phase==='done'){if(m.winner===u){p.g=(p.g||0)+m.bet[opp];p.w=(p.w||0)+1;p.ld=m.bet[opp]}else{p.g=Math.max(0,(p.g||0)-m.bet[u]);p.l=(p.l||0)+1;p.ld=-m.bet[u]}}else p.ld=0;
    p.ls=mid;return p}))}
async function leaveMatch(){const m=S.match;if(m)SS.set('nb-last',other(m,S.uid));
  await DB.tx(R()+'/mm',mm=>{mm=mm||{};if(mm.a)delete mm.a[S.uid];return mm});DB.update(R()+'/players/'+S.uid,{st:'idle'});S.sel=null}

/* ========== 相手さがし ========== */
function queueTick(){const u=S.uid,lastOpp=SS.get('nb-last')||'';let got=null;
  once('q',()=>DB.tx(R()+'/mm',mm=>{mm=mm||{};const q=mm.q=mm.q||{},a=mm.a=mm.a||{};got=null;if(a[u])return undefined;const now=DB.now();
    Object.keys(q).forEach(k=>{if(now-q[k].t>12000||a[k])delete q[k]});
    const others=Object.keys(q).filter(k=>k!==u);let cand=others.filter(k=>k!==lastOpp&&q[k].last!==u);
    const since=(q[u]&&q[u].since)||now;if(!cand.length&&others.length&&now-since>6000)cand=others;
    if(cand.length){const o=cand.sort((x,y)=>q[x].since-q[y].since)[0],mid='m'+rid(8);delete q[o];delete q[u];a[u]={mid,opp:o};a[o]={mid,opp:u};got=o;return mm}
    q[u]={t:now,since,last:lastOpp};return mm}))}
function startWait(){if(((me()||{}).g||0)<1)return;S.waiting=true;lastQ=0;DB.update(R()+'/players/'+S.uid,{st:'wait'});render()}
function stopWait(){S.waiting=false;DB.tx(R()+'/mm',mm=>{mm=mm||{};if(mm.q)delete mm.q[S.uid];return mm});DB.update(R()+'/players/'+S.uid,{st:'idle'});render()}

/* ========== 部屋に入る・出る ========== */
function clearSubs(){unsubs.forEach(f=>f());unsubs=[];munsubs.forEach(f=>f());munsubs=[]}
function goHome(msg){clearSubs();SS.del('nb');Object.assign(S,{role:null,code:null,uid:null,meta:undefined,players:{},seen:{},assign:null,mid:null,match:null,waiting:false,sel:null,closeArm:false,homeErr:msg||''});render()}
function enter(){
  clearSubs();let metaSeen=false;
  unsubs.push(DB.on(R()+'/meta',v=>{if(!v){if(metaSeen||S.meta===undefined){return goHome(metaSeen?'部屋が閉じられました':'部屋が見つかりません')}}metaSeen=true;S.meta=v;render()}));
  unsubs.push(DB.on(R()+'/players',v=>{S.players=v||{};render()}));
  if(S.role==='teacher')unsubs.push(DB.on(R()+'/seen',v=>{S.seen=v||{};render()}));
  else unsubs.push(DB.on(R()+'/mm/a/'+S.uid,onAssign));
}
function onAssign(a){
  S.assign=a;
  if(!a){munsubs.forEach(f=>f());munsubs=[];S.mid=null;S.match=null;S.rev=null;return render()}
  if(a.mid===S.mid)return;
  munsubs.forEach(f=>f());munsubs=[];S.mid=a.mid;S.match=null;S.rev=null;S.betNote=false;S.waiting=false;S.sel=null;S.oppSeen=DB.now();
  DB.update(R()+'/players/'+S.uid,{st:'play'});
  munsubs.push(DB.on(mpath(),m=>{const pv=S.match;S.match=m?norm(m):null;const nl=pv&&S.match&&S.match.last&&!S.match.last.to&&(!pv.last||pv.last.at!==S.match.last.at),snap=nl?animSnap(S.match):null;sfxMatch(pv,S.match);if(pv&&S.match&&S.match.phase==='bet'&&pv.ok[S.uid]&&!S.match.ok[S.uid]&&pv.bet[S.uid]===S.match.bet[S.uid])S.betNote=true;if(S.match){if(S.match.turnStart!==lastTurnStart){lastTurnStart=S.match.turnStart;S.sel=null}if(S.match.phase==='done'||S.match.phase==='void')settle()}render();if(nl)animPlace(snap,S.match)}));
  munsubs.push(DB.on(R()+'/seen/'+a.opp,v=>{if(v)S.oppSeen=v}));
  render();
}
async function createRoom(){
  const g=Math.max(1,Math.min(99,parseInt(($('#gems')||{}).value,10)||RULE.startGems));let code;
  for(let i=0;i<5;i++){code=String(Math.floor(100000+Math.random()*900000));if(!(await DB.get('rooms/'+code+'/meta')))break}
  S.role='teacher';S.code=code;S.uid='t'+rid(8);
  await DB.set(R()+'/meta',{t:DB.now(),g,host:S.uid});SS.set('nb',{role:S.role,code:S.code,uid:S.uid,name:''});enter();
}
async function joinRoom(){
  const code=($('#code').value||'').replace(/\D/g,''),name=($('#name').value||'').trim().slice(0,8);
  if(code.length!==6)return homeErr('合言葉は6けたの数字です');if(!name)return homeErr('ニックネームを入れてね');
  const meta=await DB.get('rooms/'+code+'/meta');if(!meta)return homeErr('その合言葉の部屋が見つかりません');
  S.role='student';S.code=code;S.uid='u'+rid(10);S.name=name;
  await DB.set(R()+'/players/'+S.uid,{n:name,g:meta.g,w:0,l:0,st:'idle'});await DB.set(R()+'/seen/'+S.uid,DB.now());
  SS.set('nb',{role:S.role,code:S.code,uid:S.uid,name});enter();
}
function homeErr(t){const e=$('#herr');if(e)e.textContent=t}

/* ========== 画面 ========== */
function render(){
  let h,wide=false;
  if(!S.role)h=vHome();
  else if(S.role==='teacher'){h=vTeacher();wide=true}
  else if(!me())h=`<div class="home"><div class="sub center">読みこみ中…</div></div>`;
  else if(S.assign){const m=S.match;h=!m?vWaitMatch():m.phase==='bet'?vBet(m):(m.phase==='done'||m.phase==='void')?vResult(m):vPlay(m)}
  else h=vLobby();
  app.className=wide?'wide':'';
  if(!S.role&&($('#code')||$('#gems'))&&!S.homeErr&&!S.homeDirty)return;S.homeDirty=false;
  if(h===lastHtml&&app.innerHTML){lastKey=uiKey();return tickDom()}
  animCleanup();app.innerHTML=h;lastHtml=h;lastKey=uiKey();S.homeErr='';tickDom();
}

  if(S.homeT)return `<div class="home">${title}
  <div class="card col" style="margin-top:8px"><div class="label">先生用</div><div class="sub">部屋を作ると、生徒に伝える合言葉が出ます</div><div class="row"><span class="sub" style="white-space:nowrap">最初に配るジェム</span><input id="gems" inputmode="numeric" value="${RULE.startGems}" style="padding:9px 12px;font-size:15px"></div><button class="btn" data-act="create">部屋を作る</button></div>
  <div class="err" id="herr">${esc(S.homeErr)}</div><button class="link" data-act="homes">生徒の画面にもどる</button>${demo}</div>`;

  <div class="col" style="margin-top:8px"><input id="code" inputmode="numeric" maxlength="6" placeholder="合言葉（6けた）" value="${esc(pre)}"><input id="name" maxlength="8" placeholder="ニックネーム"><button class="btn" data-act="join">部屋に入る</button></div>
  <div class="err" id="herr">${esc(S.homeErr)}</div><button class="link" data-act="sfx">効果音：${SFX.on?'オン':'オフ'}（タップで切りかえ）</button><button class="link" data-act="homet">先生はこちら</button>${demo}</div>`}
function ranked(){return Object.keys(S.players).map(u=>Object.assign({u},S.players[u])).sort((a,b)=>(b.g||0)-(a.g||0)||(b.w||0)-(a.w||0))}
function vLobby(){const p=me(),r=ranked(),my=r.findIndex(x=>x.u===S.uid);let top=r.slice(0,5);if(my>=5)top=r.slice(0,4).concat([r[my]]);
  return `<div class="top"><span>部屋 <b class="mono">${esc(S.code)}</b>　${esc(p.n)}</span><button class="link" data-act="sfx" style="padding:0">効果音：${SFX.on?'オン':'オフ'}</button></div>
  <div class="card center col" style="gap:4px"><div class="label">あなたのジェム</div><div class="big gem">💎 ${p.g||0}</div><div class="sub">${my+1}位 ／ ${r.length}人　${p.w||0}勝 ${p.l||0}敗</div></div>
  <div class="rank">${top.map(x=>`<div class="${x.u===S.uid?'me':''}"><span>${r.indexOf(x)+1}位　${esc(x.n)}</span><span class="gem">💎 ${x.g||0}</span></div>`).join('')}</div>

function vWaitMatch(){return `<div class="home"><div class="center sub pulse">相手が見つかりました。準備中…</div></div>`}
function vBet(m){const u=S.uid,o=other(m,u),g=(me()||{}).g||1;
  return `<div class="top"><span>部屋 <b class="mono">${esc(S.code)}</b></span><span class="mono timer" id="bt"></span></div>
  <div class="center" style="margin-top:8px"><div class="label">対戦相手が決まりました</div><div class="sub" style="margin-top:4px">出し合うジェムの数を決めよう。勝った方が全部もらえます</div></div>

    <div><div class="n">${esc(m.names[o])}</div><div class="b">💎${m.bet[o]}</div><span class="okb ${m.ok[o]?'on':''}">${m.ok[o]?'OK':'考え中'}</span></div></div>

  <div class="pm"><button class="btn ghost" data-act="bet" data-d="-1" ${m.bet[u]<=1?'disabled':''}>− へらす</button><button class="btn ghost" data-act="bet" data-d="1" ${m.bet[u]>=g?'disabled':''}>＋ ふやす</button></div>
  <button class="btn" data-act="okbet" ${m.ok[u]?'disabled':''}>${m.ok[u]?'相手を待っています…':'これでOK'}</button>`}
function dots(n){return '<span class="dots">'+Array.from({length:RULE.winsNeeded},(_,i)=>`<b class="${i<n?'on':''}"></b>`).join('')+'</span>'}
function vPlay(m){const u=S.uid,o=other(m,u),on=m.phase==='play',mine=m.turn===u&&on,hand=m.hands[u],now=DB.now(),oppN=esc(m.names[o]);
  const since=m.last?now-m.last.at:1e9,lock=on&&since<LOCK,fb=on&&since<FB&&!m.pick;
  let panel;
  if(m.phase==='roundEnd'){const w=m.rw;panel=`<div class="panel ${w==='draw'?'':w===u?'ok':'ng'}"><div class="ttl">${m.round}本目は${w==='draw'?'引き分け':w===u?'あなたの勝ち！':oppN+'の勝ち'}</div><div class="txt">先に2本とった方が勝ち（いま あなた ${m.wins[u]}本・${oppN} ${m.wins[o]}本）</div><div class="who" id="rg"></div></div>`}
  else if(fb){const l=m.last,who=l.u===u?'あなた':oppN;
    if(l.to)panel=`<div class="panel ng"><div class="ttl v"><span>${who}：時間切れ</span><small>手札が1枚ふえた</small></div></div>`;
    else{const c=CARDS[l.c];panel=`<div class="panel ${l.ok?'ok':'ng'}"><div class="ttl v"><span>${who}：${l.ok?'正解！':'ざんねん…'}</span>${l.ok?'':'<small>手札が1枚ふえた</small>'}</div><div class="ans"><span class="yr mono">${c.year}年</span>${esc(c.title)}</div><div class="txt">${esc(c.text)}</div></div>`}}
  else if(m.pick){const c=CARDS[m.pick];panel=mine?`<div class="panel ask"><div class="who">年の古い順にならべよう</div><div class="ttl">「${esc(c.title)}」はどこに入る？</div><div class="txt">${esc(c.text)}</div></div>`:`<div class="panel"><div class="who">${oppN}が出すカード。どこに入るか考えてみよう</div><div class="ttl">${esc(c.title)}</div><div class="txt">${esc(c.text)}</div></div>`}
  else panel=`<div class="panel ${mine?'ask':''}"><div class="ttl center">${mine?'あなたの番<br>出すカードを1枚えらぼう':oppN+'が考え中…'}</div></div>`;
  const canPick=mine&&!lock,placing=canPick&&!!m.pick,L=m.line;let tl='';
  const slot=g=>!placing?'':S.sel===g?`<button class="tr pre" data-act="confirmgap">ここに置く（もう一度タップで決定）</button>`:`<button class="slot" data-act="gap" data-g="${g}">＋ ここ？</button>`;
  L.forEach((id,i)=>{const c=CARDS[id],cls=m.last&&m.last.c===id?(m.last.ok?'ok':'ng'):'';tl+=slot(i)+`<div class="tr ${cls}" data-k="${id}" ${placing?`data-act="rowgap" data-i="${i}"`:''}><span class="y mono">${c.year}</span><span class="t">${esc(c.title)}</span></div>`});tl+=slot(L.length);
  const cols=Math.max(3,hand.length);
  return `<div class="race"><div class="${mine?'act':''}"><span>あなた<em>${m.wins[u]}本</em></span><b>あと${hand.length}枚</b></div><div class="${on&&!mine?'act':''}"><span>${oppN}<em>${m.wins[o]}本</em></span><b>あと${m.hands[o].length}枚</b></div></div>
  <div class="goal"><span>${m.firstOut&&on?'相手は出し切った。これが最後の1手':'先に0枚で1本・2本とったら勝ち'}</span><span class="mono timer" id="tt"></span></div>
  ${panel}<div class="dir">▲ むかし<small>年が古い</small></div><div class="tl ${canPick&&!m.pick?'dim':''}">${tl}</div><div class="dir">▼ さいきん<small>年が新しい</small></div>
  <div class="foot"><span>自分の手札${mine&&m.pick?'（タップで選び直せます）':''}</span><span class="gem">💎 ${m.bet[u]} vs ${m.bet[o]}</span></div>
  <div class="hand ${canPick?'':'dim'}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${hand.map(id=>`<button class="hc ${CARDS[id].title.length>10?'l':CARDS[id].title.length>7?'m':''} ${m.pick===id&&mine?'on':canPick&&!m.pick?'can':''}" data-k="${id}" ${canPick?`data-act="pick" data-c="${id}"`:''}>${esc(CARDS[id].title)}</button>`).join('')}</div>`}
function revAgain(r,id){if(r.re[id]==null){r.re[id]=r.i;r.q.push(id)}}
function missList(m){return Object.keys(m.miss[S.uid]).map(id=>CARDS[id]).sort((a,b)=>a.year-b.year||(a.id<b.id?-1:1))}
function vResult(m){const u=S.uid,o=other(m,u),p=me()||{},v=m.phase==='void',win=m.winner===u,miss=missList(m),done=p.ls===S.mid;
  if(!S.rev)S.rev={q:miss.map(c=>c.id),re:{},i:0,inp:'',shown:false,ok:false,right:0,skip:false};const r=S.rev,reviewing=!v&&!r.skip&&r.i<r.q.length;
  const head=`<div class="card rescard"><div><div class="res ${v?'':win?'win':'lose'}">${v?'無効試合':win?'勝ち':'負け'}</div><div class="sub">${v?'相手の接続が切れました':`vs ${esc(m.names[o])}　${m.wins[u]} − ${m.wins[o]}`}</div></div>
  ${v?'<div class="sub">ジェムはそのまま</div>':`<div class="gem" style="font-size:20px;text-align:right">💎 ${win?'+'+m.bet[o]:'−'+m.bet[u]}<div class="sub">${done?'いま '+(p.g||0)+'個':''}</div></div>`}</div>`;
  if(reviewing){const c=CARDS[r.q[r.i]],again=r.re[c.id]===r.i;
    return `${head}<div class="label">復習：まちがえたカードをもう一度（${r.i+1}/${r.q.length}）</div>
    <div class="panel ${r.shown?(r.ok?'ok':'ng'):'ask'}"><div class="who">${r.shown?(r.ok?'正解！':'正しくは '+c.year+'年'+(r.inp?'（あなたの答え：'+esc(r.inp)+'年）':'')+(again?'　あとでもう一度出ます':'')):'これは何年のできごと？'}</div><div class="ttl">${r.shown?`<span class="yr mono">${c.year}年</span>`:''}${esc(c.title)}</div><div class="txt">${esc(c.text)}</div></div>
    ${r.shown?`<div class="grow"></div><button class="btn" data-act="revnext">${r.i+1<r.q.length?'次のカードへ':'おわり'}</button>`:
    `<div class="yin mono">${r.inp?esc(r.inp)+'<i>年</i>':'<span class="ph">年号を数字で入れよう</span>'}</div><div class="grow"></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join('')}<button data-act="key" data-k="del">⌫</button><button data-act="key" data-k="0">0</button><button class="go" data-act="key" data-k="go" ${r.inp.length>=3?'':'disabled'}>答える</button></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost sm" data-act="revdk">わからない（答えを見る）</button><button class="link" data-act="revskip">とばす</button></div>`}`}
  const show=miss.slice(0,12),more=miss.length-show.length;
  return `${head}<div class="label">${miss.length&&!r.skip?'復習おわり　'+r.right+' / '+r.q.length+' 問正解':'まちがえたカード'}</div>
  <div class="grow">${miss.length?`<div class="miss">${show.map(c=>`<div><b class="mono">${c.year}</b>${esc(c.title)}</div>`).join('')}</div>${more>0?`<div class="sub" style="margin-top:6px">ほか ${more}枚</div>`:''}`:'<div class="sub">'+(v?'':'まちがいなし')+'</div>'}</div>
  <button class="btn" data-act="leave">部屋に戻る</button>`}
function vTeacher(){const r=ranked(),now=DB.now(),stt={play:'対戦中',wait:'対戦待ち',idle:'待機'};
  return `<div class="thead"><div><div class="label">合言葉</div><div class="code mono">${esc(S.code)}</div><div class="sub">${esc(location.origin+location.pathname)}　を開いて合言葉を入れる</div></div>
  <div class="col" style="align-items:flex-end"><div class="sub">参加 ${r.length}人　最初のジェム ${S.meta?S.meta.g:''}個${DB.demo?'　（デモモード）':''}</div><button class="btn ghost sm" data-act="close">${S.closeArm?'もう一度押すと閉じます':'部屋を閉じる'}</button></div></div>
  <div class="plist">${r.length?r.map((p,i)=>{const off=now-(S.seen[p.u]||0)>30000;return `<div class="pl ${off?'off':''}"><span class="mono sub">${i+1}</span><span class="nm">${esc(p.n)}</span><span class="gem">💎 ${p.g||0}</span><span class="sub mono">${p.w||0}-${p.l||0}</span><span class="st ${p.st||''}">${off?'オフライン':stt[p.st]||'待機'}</span><button class="btn ghost sm" data-act="give" data-u="${p.u}" style="padding:5px 0">+5</button></div>`}).join(''):'<div class="sub">生徒が入るのを待っています…</div>'}</div>`}

/* ========== 時間で動くもの ========== */
function uiKey(){const m=S.match;if(!m||S.role!=='student')return '';const d=m.last?DB.now()-m.last.at:1e9;return [m.phase,d<LOCK?1:0,d<FB?1:0].join('|')}
function tickDom(){const m=S.match,now=DB.now();if(!m)return;
  const bt=$('#bt');if(bt)bt.textContent=Math.max(0,Math.ceil(RULE.betSec-(now-m.betStart)/1000))+'秒';
  const tt=$('#tt');if(tt&&m.phase==='play'){const s=Math.max(0,Math.ceil(RULE.turnSec-(now-m.turnStart)/1000));const my=m.turn===S.uid;tt.textContent=my?(s<=10?'あと'+s+'秒で1枚ふえる':'のこり '+s+'秒'):'相手 のこり '+s+'秒';tt.classList.toggle('hot',my&&s<=10)}
  const rg=$('#rg');if(rg){const w=m.ids.some(u=>m.wins[u]>=RULE.winsNeeded);rg.textContent=w?'結果を表示します…':'次の1本がはじまります…'}
}
function tick(){
  if(!S.role||!DB)return;const now=DB.now();
  if(S.role==='student'&&me()&&now-lastBeat>10000){lastBeat=now;DB.set(R()+'/seen/'+S.uid,now)}
  if(S.role==='teacher'){if(now-lastBeat>10000){lastBeat=now;render()}return}
  if(S.waiting&&!S.assign&&now-lastQ>3000){lastQ=now;queueTick()}
  if(S.assign&&!S.match)ensureMatch();
  const m=S.match;
  if(m){const u=S.uid,o=other(m,u);
    if(m.phase==='bet'){if(m.ids.every(x=>m.ok[x]))startMatch(false);else if(now-m.betStart>RULE.betSec*1000)startMatch(true)}
    if(m.phase==='play'){const el=now-m.turnStart;if(m.turn===u&&el>RULE.turnSec*1000)timeoutTurn(u,m.turnStart);else if(m.turn===o&&el>(RULE.turnSec+6)*1000)timeoutTurn(o,m.turnStart)}
    if(m.phase==='roundEnd'&&now-m.rEnd>RULE.roundGapSec*1000)nextRound();
    if(m.phase!=='done'&&m.phase!=='void'&&now-S.oppSeen>RULE.voidSec*1000)voidMatch();
    if(uiKey()!==lastKey)render();else tickDom();
  }
}

/* ========== 操作 ========== */
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,m=S.match;
  if(a==='pick')SFX.play('pick');else if(a==='gap'||a==='rowgap')SFX.play('sel');else if(a!=='key'&&a!=='sfx'&&a!=='confirmgap')SFX.play('tap');
  if(a==='sfx'){SFX.toggle();S.homeDirty=true;render();return}
  if(a==='join')joinRoom().catch(()=>homeErr('通信できませんでした'));
  else if(a==='homet'||a==='homes'){S.homeT=a==='homet';S.homeDirty=true;render()}
  else if(a==='create')createRoom().catch(()=>homeErr('通信できませんでした'));
  else if(a==='wait')startWait();else if(a==='stopwait')stopWait();
  else if(a==='bet')setBet(m.bet[S.uid]+Number(t.dataset.d));else if(a==='okbet'){S.betNote=false;okBet()}
  else if(a==='pick')pickCard(t.dataset.c);
  else if(a==='gap'){S.sel=Number(t.dataset.g);render()}
  else if(a==='rowgap'){const r=t.getBoundingClientRect(),i=Number(t.dataset.i);S.sel=(e.clientY-r.top<r.height/2)?i:i+1;render()}
  else if(a==='confirmgap'){if(S.sel!=null&&m.pick)place(S.sel)}
  else if(a==='key'){const r=S.rev,k=t.dataset.k;if(!r)return;if(k!=='go')SFX.play('tap');if(k==='del')r.inp=r.inp.slice(0,-1);else if(k==='go'){const c=CARDS[r.q[r.i]];r.ok=Number(r.inp)===c.year;if(r.ok)r.right++;else revAgain(r,c.id);r.shown=true;SFX.play(r.ok?'ok':'ng')}else if(r.inp.length<4)r.inp+=k;render()}
  else if(a==='revnext'){const r=S.rev;r.i++;r.inp='';r.shown=false;render()}
  else if(a==='revdk'){const r=S.rev;r.inp='';r.ok=false;revAgain(r,r.q[r.i]);r.shown=true;render()}
  else if(a==='revskip'){S.rev.skip=true;render()}
  else if(a==='leave')leaveMatch();
  else if(a==='give')DB.tx(R()+'/players/'+t.dataset.u,p=>{if(!p)return p;p.g=(p.g||0)+5;return p});
  else if(a==='close'){if(S.closeArm){DB.set(R(),null)}else{S.closeArm=true;render();setTimeout(()=>{S.closeArm=false;if(S.role==='teacher')render()},3000)}}
});

/* ========== はじまり ========== */
(async function boot(){
  loadCards();
  try{DB=window.FIREBASE_CONFIG?await makeFirebase(window.FIREBASE_CONFIG):makeLocal()}
  catch(e){console.error(e);app.innerHTML='<div class="home"><div class="err">通信の準備に失敗しました。ページを開き直してください</div></div>';return}
  const s=SS.get('nb');if(s&&s.code){Object.assign(S,{role:s.role,code:s.code,uid:s.uid,name:s.name||''});enter()}
  render();setInterval(tick,500);
})();
</script>
